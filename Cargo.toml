[package]
name = "extmv"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Organize files in a directory into <dest_base>/<extension>/ subdirectories"
license = "MIT"
repository = "https://github.com/mikemadden42/extmv"
readme = "README.md"
keywords = ["files", "organize", "extension", "cli"]
categories = ["command-line-utilities", "filesystem"]
publish = false

[dependencies]
libc = "0.2.190"

[lints.clippy]
# Enforced in CI (warnings are errors there). Priority -1 lets individual
# lints be overridden below the group if ever needed.
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
