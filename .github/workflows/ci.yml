name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # POSIX-only (std::os::unix, renameat2/renamex_np): no Windows.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
      # macOS runners have no second filesystem, so the cross-filesystem
      # cases would skip. An exFAT RAM disk provides one and also exercises
      # the check-then-rename fallback (no RENAME_EXCL, no hard links).
      - name: Create exFAT RAM disk
        if: runner.os == 'macOS'
        run: |
          dev=$(hdiutil attach -nomount ram://2457600 | awk '{print $1}')
          diskutil erasevolume ExFAT EXTMVT "$dev"
          echo "EXTMV_OTHERFS=/Volumes/EXTMVT" >> "$GITHUB_ENV"
      # Includes tests/run.sh via tests/conformance.rs.
      - run: cargo test --locked
        env:
          EXTMV_HEAVY_TESTS: 1

  msrv:
    name: build (MSRV 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --all-targets
